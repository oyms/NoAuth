<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="{Favicon}"/>
    <title>NoAuth login</title>
    <style>
        .label_and_input {
            display: block;
            padding-bottom: .2em;
        }

        label {
            padding-right: .5em;
            display: inline-block;
        }

        input[type=text] {
            width: 15em;
        }

        .claims_fieldset {
            margin-bottom: .5em;
            border-color: lightcyan;
        }

        .container_for_form {
            max-width: 80em;
        }

        details {
            width: 15em;
        }

            details[open] {
                width: initial;
            }

        details > summary {
            display: flex;
            align-items: center;
            gap: .4em;
            cursor: pointer;
            list-style: none;
        }

            details > summary::-webkit-details-marker {
                display: none;
            }

            details > summary::before {
                content: '▸';
                flex: none;
            }

        details[open] > summary::before {
            content: '▾';
        }

        .profile_text {
            flex: 1;
            min-width: 0;
        }

            .profile_text > h3,
            .profile_description {
                margin: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .profile_text > h3 {
                font-size: 1em;
            }

        .profile_description {
            font-size: .9em;
            font-style: italic;
            color: grey;
        }

        details[open] .profile_text > h3,
        details[open] .profile_description {
            white-space: normal;
        }

        .container_for_profiles > form > button[type=submit] {
            margin-top: .3em;
        }

        .container_for_profiles {
            display: flex;
            flex-wrap: wrap;
        }

            .container_for_profiles > form {
                border-style: solid;
                border-color: cornflowerblue;
                border-radius: .2em;
                border-width: thin;
                padding: .3em .2em;
                margin: 0 .5em .5em 0;
                display: block;
            }

        .dummy_image {
            order: 1;
            flex: none;
            width: 2.5em;
            height: 2.5em;
        }
    </style>
    <script language="javascript">
        class LocalizedTextElement extends HTMLElement {
            constructor() {
                super();
            }
            connectedCallback() {
                const index = this.getLanguageIndex();
                let hasMatch = false;
                if (index > -1) {
                    const siblings = this.parentElement.querySelectorAll('localized-text[data-lang]');
                    for (const txt of siblings) {
                        if (txt !== this) {
                            const siblingIndex = txt.getLanguageIndex ? txt.getLanguageIndex() : this.getLanguageIndex(txt);
                            if (siblingIndex > -1) {
                                if (siblingIndex < index) {
                                    hasMatch = true;
                                }
                                if (siblingIndex > index) {
                                    txt.hidden = true;
                                }
                            }
                        }
                    }
                    if (hasMatch) this.hidden = true;
                } else {
                    this.hidden = true;
                }
            }
            getLanguageIndex(element = this) {
                const lang = element.dataset.lang;
                if(lang === 'default') return Infinity;
                return LocalizedTextElement.languageIndex(lang);
            }

            /**
             * The position of a language in the browser's preferred languages, or -1.
             * 'nb' matches 'nb', 'nb-NO' and 'no'.
             */
            static languageIndex(lang) {
                return navigator.languages.findIndex(preferred => {
                    const [primary] = preferred.toLowerCase().split('-');
                    return primary === lang || (lang === 'nb' && primary === 'no');
                });
            }
        }

        customElements.define('localized-text', LocalizedTextElement);

        /**
         * Localizes attributes, which cannot contain localized-text elements.
         * E.g. data-l10n-placeholder-nb="..." sets the placeholder for Norwegian Bokmål.
         * The attribute itself (e.g. placeholder="...") is the default.
         */
        function localizeAttributes(root) {
            for (const element of root.querySelectorAll('*')) {
                const translations = {};
                for (const { name, value } of element.attributes) {
                    const match = name.match(/^data-l10n-([a-z]+)-([a-z]+)$/);
                    if (match) (translations[match[1]] ??= []).push({ lang: match[2], value });
                }
                for (const [attribute, options] of Object.entries(translations)) {
                    const best = options
                        .map(option => ({ ...option, index: LocalizedTextElement.languageIndex(option.lang) }))
                        .filter(option => option.index > -1)
                        .sort((a, b) => a.index - b.index)[0];
                    if (best) element.setAttribute(attribute, best.value);
                }
            }
        }
    </script>
</head>
<body>
    <h1>
        <localized-text data-lang="nb">Hvem vil du være?</localized-text>
        <localized-text data-lang="nn">Kven vil du være?</localized-text>
        <localized-text data-lang="en">Who are you today?</localized-text>
        <localized-text data-lang="nb">Logg inn!</localized-text>
        <localized-text data-lang="nn">Logg inn!</localized-text>
        <localized-text data-lang="en">Log in!</localized-text>
        <localized-text data-lang="default">Log in!</localized-text>
    </h1>

    

    <div id="empty_form_container" class="container_for_form"></div>

    <div id="profile_forms_container"></div>

    <template id="form_template">
        <form action="" method="post">
            <div class="container_for_inputs"></div>
            <button type="submit">
                <localized-text data-lang="nb">Logg inn</localized-text>
                <localized-text data-lang="nn">Logg inn</localized-text>
                <localized-text data-lang="en">Login</localized-text>
                <localized-text data-lang="default">Login</localized-text>
            </button>
        </form>
    </template>

    <template id="claim_input_template">
        <div class="label_and_input">
            <label>
                <localized-text data-lang="nb">Type:</localized-text>
                <localized-text data-lang="nn">Type:</localized-text>
                <localized-text data-lang="en">Type:</localized-text>
                <localized-text data-lang="default">Type:</localized-text>
                <input type="text" name="claim_type">
            </label>
            <label>
                <localized-text data-lang="nb">Verdi:</localized-text>
                <localized-text data-lang="nn">Verdi:</localized-text>
                <localized-text data-lang="en">Value:</localized-text>
                <localized-text data-lang="default">Value:</localized-text>
                <input type="text" name="claim_value">
            </label>
        </div>
    </template>

    <template id="all_input_templates">
        <div class="label_and_input">
            <label for="user_id">
                <localized-text data-lang="nb">Id:</localized-text>
                <localized-text data-lang="nn">Id:</localized-text>
                <localized-text data-lang="en">Id:</localized-text>
                <localized-text data-lang="default">Id:</localized-text>
            </label>
            <input type="text" name="uid" id="user_id"
                   placeholder="Leave empty for a random value"
                   data-l10n-placeholder-nb="Tomt felt gir tilfeldig verdi"
                   data-l10n-placeholder-nn="Tomt felt gir tilfeldig verdi"
                   data-l10n-placeholder-en="Leave empty for a random value">
        </div>
        <div class="label_and_input">
            <label for="given_name">
                <localized-text data-lang="nb">Fornavn:</localized-text>
                <localized-text data-lang="nn">Førenamn:</localized-text>
                <localized-text data-lang="en">Given name:</localized-text>
                <localized-text data-lang="default">Given name:</localized-text>
            </label>
            <input type="text" name="given_name" id="given_name"
                   placeholder="Leave empty for a random value"
                   data-l10n-placeholder-nb="Tomt felt gir tilfeldig verdi"
                   data-l10n-placeholder-nn="Tomt felt gir tilfeldig verdi"
                   data-l10n-placeholder-en="Leave empty for a random value">
        </div>
        <div class="label_and_input">
            <label for="family_name">
                <localized-text data-lang="nb">Etternavn:</localized-text>
                <localized-text data-lang="nn">Etternamn:</localized-text>
                <localized-text data-lang="en">Family name:</localized-text>
                <localized-text data-lang="default">Family name:</localized-text>
            </label>
            <input type="text" name="family_name" id="family_name"
                   placeholder="Leave empty for a random value"
                   data-l10n-placeholder-nb="Tomt felt gir tilfeldig verdi"
                   data-l10n-placeholder-nn="Tomt felt gir tilfeldig verdi"
                   data-l10n-placeholder-en="Leave empty for a random value">
        </div>
        <fieldset class="claims_fieldset">
            <legend>
                <localized-text data-lang="nb">Claims</localized-text>
                <localized-text data-lang="nn">Claims</localized-text>
                <localized-text data-lang="en">Claims</localized-text>
                <localized-text data-lang="default">Claims</localized-text>
            </legend>
            <div class="container_for_claim_inputs"></div>
            <button type="button" class="add_claim_button"
                    title="Add claim"
                    data-l10n-title-nb="Legg til claim"
                    data-l10n-title-nn="Legg til claim"
                    data-l10n-title-en="Add claim">➕</button>
        </fieldset>
    </template>

    <template id="profile_template">
        <div class="container_for_profile" title=" ">

            <details>
                <summary>
                    <svg width="90" height="105" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 100 100" class="dummy_image">
                        <title>Dummy</title>
                        <g>
                            <rect id="svg_2" height="7.947" width="27.573" y="73.30496" x="44.25997"/>
                            <rect id="svg_3" height="7.948" width="27.574" y="84.05496" x="44.24497"/>
                            <rect id="svg_4" height="7.948" width="27.574" y="94.78096" x="44.20997"/>
                            <g id="svg_5">
                                <path fill="#000000" id="svg_6" d="m44.27997,45.81895l11.45,0l0,-11.45c-6.324,0 -11.45,5.126 -11.45,11.45z"/>
                                <path fill="#000000" id="svg_7" d="m55.72997,45.81895l0,11.45c6.324,0 11.44903,-5.125 11.44903,-11.45l-11.44903,0z"/>

                            <path fill="#f37321" id="svg_8" d="m48.527,2.99947c-17.092,0 -32.854,12.83003 -36.129,26.96903c-0.742,3.143 -1.555,11.352 -1.555,11.352l-7.86996,19.816c-0.15,0.357 -0.226,0.759 -0.226,1.181c0,1.67 1.369,3.035 3.046,3.035l5.04996,0l0,10.528c0,17.776 8.324,18.247 14.85,17.055l15.04,-4.611l-0.104,-18.09l31.1581,0.065c8.767,-6.896 14.395,-17.606 14.395,-29.624c0,-20.811 -16.863,-37.67603 -37.6551,-37.67603zm-28.432,45.83103c-2.305,0 -4.188,-1.884 -4.188,-4.214c0,-2.316 1.883,-4.196 4.188,-4.196c2.326,0 4.219,1.88 4.219,4.196c-0.001,2.332 -1.894,4.214 -4.219,4.214zm35.383,10.514c-7.494,0 -13.568,-6.074 -13.568,-13.569c0,-7.492 6.074,-13.566 13.568,-13.566c7.492,0 13.5661,6.074 13.5661,13.566c0.001,7.495 -6.0731,13.569 -13.5661,13.569z"/>
                        </g>
                    </svg>
                    <div class="profile_text">
                        <h3>Profile Name</h3>
                        <p class="profile_description"></p>
                    </div>
                </summary>

            </details>
        </div>
    </template>

    <template id="group_template">
        <section>
            <h2>Category</h2>
            <div class="container_for_profiles"></div>
        </section>
    </template>

<script type="module" language="javascript">

        const claimTemplate = document.querySelector('#claim_input_template');
        const formTemplate = document.querySelector('#form_template');
        const inputTemplate = document.querySelector('#all_input_templates');
        const groupTemplate = document.querySelector('#group_template');
        const profileTemplate = document.querySelector('#profile_template');
        const emptyFormPlaceholder = document.querySelector('#empty_form_container');
        const profileFormsPlaceholder = document.querySelector('#profile_forms_container');
        const apiUrl = '{LoginProfile}';

        for (const template of document.querySelectorAll('template')) localizeAttributes(template.content);

        const emptyForm = formTemplate.content.cloneNode(true);
        emptyForm.querySelector('.container_for_inputs')
            .appendChild(inputTemplate.content.cloneNode(true));
        emptyFormPlaceholder.appendChild(emptyForm);

        const templateResults = await fetch(apiUrl)
        if (templateResults.ok) {
            const json = await templateResults.json();
            const groups = json.logins.reduce((group, template) => {
                const category = template.category ?? '*';
                group[category] = group[category] || [];
                group[category].push(template);
                return group;
            }, {});
            for (const group in groups) {
                const groupElement = groupTemplate.content.cloneNode(true);
                groupElement.querySelector('h2').innerText = group;
                const profilePlaceholder = groupElement.querySelector('.container_for_profiles');

                const profileNodes = groups[group].map(profile => {

                    const formElement = formTemplate.content.cloneNode(true);

                    const profileElement = profileTemplate.content.cloneNode(true);
                    profileElement.querySelector('h3').innerText = profile.profileName;
                    const descriptionPlaceholder = profileElement.querySelector('.profile_description');
                    if (profile.description) {
                        descriptionPlaceholder.innerText = profile.description;
                        descriptionPlaceholder.title = profile.description;
                    } else {
                        descriptionPlaceholder.remove();
                    }
                    
                    profileElement.querySelector('.dummy_image > title').textContent = `${profile.given_name ?? ""} ${profile.family_name ?? ""}`;

                    const inputsElement = inputTemplate.content.cloneNode(true);
                    inputsElement.querySelector('input[name=given_name]').value = profile.given_name ?? '';
                    inputsElement.querySelector('input[name=family_name]').value = profile.family_name ?? '';
                    inputsElement.querySelector('input[name=uid]').value = profile.uid ?? '';


                    const claimNodes = Object.entries(profile.claims ?? {}).flatMap(([k, v]) => v.map(vv => [k, vv]))
                        .map(claim => {
                            const newClaimInputs = claimTemplate.content.cloneNode(true);
                            newClaimInputs.querySelector('input[name=claim_type]').value = claim[0];
                            newClaimInputs.querySelector('input[name=claim_value]').value = claim[1];
                            return newClaimInputs;
                        });
                    inputsElement.querySelector('.container_for_claim_inputs').append(...claimNodes);

                    profileElement.querySelector('details').append(inputsElement);
                    formElement.querySelector('.container_for_inputs').append(profileElement);
                    return formElement;
                });

                profilePlaceholder.append(...profileNodes);

                profileFormsPlaceholder.appendChild(groupElement);
            }
        }


        document.querySelectorAll('.add_claim_button').forEach(button => button.addEventListener('click', e => {
            const placeHolder = e.target.parentElement.querySelector('.container_for_claim_inputs');
            const newClaimInputs = claimTemplate.content.cloneNode(true);
            placeHolder.appendChild(newClaimInputs);
        }));

        for (const [key, value] of new URLSearchParams(window.location.search)) {
            try {
                const input = document.querySelector(`form input[name=${key}]`);
                if (input && !input.value) {
                    input.value = value;
                }
            }
            catch { }
        }

    </script>
</body>
</html>
